# Save as .github/workflows/rss.yml in a GitHub repo containing uon_news_rss.py.
# Then: Settings -> Pages -> Source: "Deploy from a branch", branch gh-pages.
# Your feed: https://<username>.github.io/<repo>/feed.xml
name: Build UoN news RSS
on:
  schedule:
    - cron: "17 * * * *"   # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: mkdir -p public && python uon_news_rss.py --out public/feed.xml
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
